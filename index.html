<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tetrads</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>
<div id="app">

  <!-- ----------  side rail + drawer  ----------
       The rail is the whole index of what the app is set from — what the
       tetrads ARE, how they are DRAWN, and how they SOUND — so there is no
       header above the panel saying the same thing twice. The drawer is the
       one you are in. Shut, the panel is the width of the rail and the
       viewport keeps everything it gives back. -->
  <aside id="panel" class="open">
    <div class="rail">
      <!-- Complexity: three pitches and the edges between them, which is
           what a limit and a complexity measure are read over. -->
      <button class="rail-btn" data-drawer="complexity" aria-expanded="true"
        title="Complexity Measures — which tetrads exist at all">
        <svg class="rail-icon" viewBox="0 0 26 26" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 4.5L21 19H5z" />
          <path d="M13 4.5v14.5M13 19l-8-6M13 19l8-6" />
        </svg>
      </button>
      <!-- Display: an eye, because the drawer changes nothing but what you
           are looking at. -->
      <button class="rail-btn" data-drawer="display" aria-expanded="false"
        title="Display — how the set is drawn and read">
        <svg class="rail-icon" viewBox="0 0 26 26" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.5 13S6.5 6.5 13 6.5 23.5 13 23.5 13 19.5 19.5 13 19.5 2.5 13 2.5 13z" />
          <circle cx="13" cy="13" r="3" />
        </svg>
      </button>
      <!-- Play: sounding the set. -->
      <button class="rail-btn" data-drawer="play" aria-expanded="false"
        title="Play — sounding the tetrads">
        <svg class="rail-icon" viewBox="0 0 26 26" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.5 6.5l9.5 6.5-9.5 6.5z" />
        </svg>
      </button>
      <!-- Export: the set leaving the app, as a picture of what is on
           screen or as the chords behind it. Its own mode rather than the
           foot of Display, because it is a different question: Display asks
           what you are looking at, Export asks who else gets it. -->
      <button class="rail-btn" data-drawer="export" aria-expanded="false"
        title="Export — pictures to keep, and chords to work with">
        <svg class="rail-icon" viewBox="0 0 26 26" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 4v11" /><path d="M8.5 10.5L13 15l4.5-4.5" />
          <path d="M5 17v3.5h16V17" />
        </svg>
      </button>
      <a class="rail-btn" id="info-link" href="https://github.com/richiegreene/tetrads"
        target="_blank" rel="noopener noreferrer" title="About Tetrads">
        <svg class="rail-icon" viewBox="0 0 26 26" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="13" cy="13" r="9.5" /><path d="M13 11.5v6" /><path d="M13 8.6v.1" />
        </svg>
      </a>
    </div>

    <div class="panel-body">
      <div class="drawers">

        <!-- ============ COMPLEXITY MEASURES ============
             What is in the set at all. Everything here changes which tetrads
             are generated, which is why it leads: the two drawers after it
             only decide what is done with whatever this produces. -->
        <div class="drawer" data-drawer="complexity">
          <h1>Tetrads <small>· complexity</small></h1>

          <fieldset>
            <legend>Limit</legend>
            <label for="limitType">Limit type</label>
            <select id="limitType"
              title="How far an interval may reach before it is left out. Odd- and integer-limit count the ratio's own numbers; prime-limit counts which primes it is built from.">
              <option value="Integer">Integer-Limit</option>
              <option value="Odd" selected>Odd-Limit</option>
              <option value="Prime">Prime-Limit</option>
            </select>
            <label for="limitValue">Limit</label>
            <input type="text" id="limitValue" value="13"
              title="The limit itself. A slash adds a virtual-fundamental filter — 13/1.3.5 keeps only tetrads whose fundamental is one of those, and 13/1...8 takes the range.">
            <div id="prime-limit-options" style="display:none">
              <label for="maxExponent">Max exponent</label>
              <input type="number" id="maxExponent" value="3" min="1" step="1"
                title="How many times one prime may be used in a single interval.">
            </div>
          </fieldset>

          <fieldset>
            <legend>Register</legend>
            <label for="equaveRatio">Equave</label>
            <input type="number" id="equaveRatio" value="2" min="1" step="0.1"
              title="How wide the whole tetrad may be, outer voice to outer voice. 2 is an octave.">
          </fieldset>

          <fieldset>
            <legend>Complexity</legend>
            <label for="complexityMethod">Measure</label>
            <select id="complexityMethod"
              title="Which measure of an interval's complexity the tetrad is sized and coloured by.">
              <option value="Arithmetic">Arithmetic</option>
              <option value="Benedetti">Benedetti</option>
              <option value="Gradus">Euler</option>
              <option value="Tenney" selected>Tenney</option>
              <option value="Weil">Weil</option>
              <option value="Wilson">Wilson</option>
            </select>
          </fieldset>
        </div>

        <!-- ============ DISPLAY ============ -->
        <div class="drawer hidden" data-drawer="display">
          <h1>Tetrads <small>· display</small></h1>

          <fieldset>
            <legend>Type/Setting</legend>
            <div class="seg" id="layout-seg">
              <button data-v="points" class="on" title="One point per tetrad">Points</button>
              <button data-v="labels" title="The enumerated ratio itself, in place of the point">Labels</button>
            </div>
            <input type="hidden" id="layoutDisplay" value="points">

            <!-- ---- what complexity is allowed to say ----
                 Drawn as the row above it, because they are the same kind of
                 press on the same kind of thing — but these two are
                 independent rather than a choice of one: a set can be sized
                 and coloured, either, or neither. The checkboxes behind them
                 are what the rest of the app reads. -->
            <div class="seg" id="channel-seg">
              <button data-v="enableSize" class="on"
                title="Let complexity set how big each tetrad is drawn">Size</button>
              <button data-v="enableColor" class="on"
                title="Let complexity set each tetrad's colour, through the colormap">Color</button>
            </div>
            <input type="checkbox" id="enableSize" checked hidden>
            <input type="checkbox" id="enableColor" checked hidden>

            <label for="baseSize">Base Size</label>
            <input type="range" id="baseSize" value="1.00" min="0.25" max="2.50" step="0.01">
            <label for="scalingFactor">Measure</label>
            <input type="range" id="scalingFactor" value="2" min="0.50" max="3.00" step="0.01">
          </fieldset>

          <fieldset>
            <legend>Omit</legend>
            <label class="vis">
              <input type="checkbox" id="hideUnisonVoices">Omit Unisons</label>
            <label class="vis">
              <input type="checkbox" id="omitOctaves">Omit Octaves</label>
          </fieldset>

          <!-- ---- how a sounding tetrad is written out ----
               The readouts are one list because they are one question — what
               the corner under the pointer says — and the three JI languages
               in it are Xenachord's own, built from the same engines, so a
               chord spelled here is spelled the way that app would spell it. -->
          <fieldset>
            <legend>Notation</legend>
            <label class="vis">
              <input type="checkbox" id="enableNotation" checked>Enable Notation</label>

            <div id="notation-options">
              <div class="tune-h">Readout</div>
              <div class="seg wrap" id="notation-seg">
                <button data-v="all" class="on" title="Ratio, HEJI and the deviation from 12EDO at once">All</button>
                <button data-v="ratio" title="The enumerated ratio itself">Ratio</button>
                <button data-v="heji" title="Helmholtz-Ellis Just Intonation">HEJI</button>
                <button data-v="sagittal" title="Sagittal">Sagittal</button>
                <button data-v="cents" title="Cents above 1/1">Cents</button>
                <button data-v="deviation" title="The nearest 12EDO note and the cents off it">12EDO</button>
              </div>
              <input type="hidden" id="notationType" value="all">

              <!-- Sagittal only, and asked in Sagittal's own terms. -->
              <div id="sagittal-options" style="display:none">
                <label for="sagittalPrecision">Precision</label>
                <select id="sagittalPrecision" title="How finely Sagittal spells the comma">
                  <option value="medium" selected>Athenian</option>
                  <option value="high">Promethean</option>
                  <option value="ultra">Herculean</option>
                  <option value="extreme">Olympian</option>
                </select>
                <div class="seg" id="sagittal-flavour">
                  <button data-v="revo" class="on" title="Pure Sagittal: the symbol carries the whole alteration">revo</button>
                  <button data-v="evo" title="Sagittal beside a conventional sharp or flat">evo</button>
                </div>
              </div>
            </div>
          </fieldset>

          <!-- ---- what the scene itself looks like and does ----
               Everything here is about the picture rather than the set: no
               control in it changes which tetrads exist or what they are
               called, only how they are coloured and how the shape moves. -->
          <fieldset>
            <legend>Visuals</legend>

            <!-- Four ramps, each drawn on the ground it is actually used
                 against, so the two greyscales read as the two different
                 layouts they are rather than as one inverted. The swatches
                 are painted from the colormap functions themselves — see
                 COLORMAPS in ui-handlers.js — so a chip cannot advertise a
                 ramp the scene does not use. -->
            <div class="tune-h">Colormap <span class="key-hint">⇧⌘L</span></div>
            <div class="maps" id="colormap-seg"></div>

            <!-- ---- how fast the shape turns ----
                 The arrow keys have always turned the tetrahedron and [ ]
                 have always changed how fast; the rate was the one thing you
                 could only find by pressing a key and watching. It is a
                 number, so it gets a slider, and the keys move the slider. -->
            <div class="tune-h">Motion <span class="key-hint">[ ]</span></div>
            <div class="pressrow">
              <label for="rotationSpeed">Rotation</label>
              <span class="pressval" id="rotation-v">34°/s</span>
            </div>
            <input type="range" id="rotationSpeed" min="0" max="100" step="1" value="50"
              title="How far one press of an arrow key turns the shape, and how fast it turns on its own.">
            <button id="autoRotate"
              title="Keep the shape turning. While it runs, the arrow keys steer it rather than nudging it.">&#8635; Rotate Continuously</button>
          </fieldset>
        </div>

        <!-- ============ PLAY ============ -->
        <div class="drawer hidden" data-drawer="play">
          <h1>Tetrads <small>· play</small></h1>

          <fieldset>
            <legend>Output</legend>
            <label for="playbackMode">Playback</label>
            <select id="playbackMode">
              <option value="browser" selected>In-Browser Audio</option>
              <option value="mpe-midi">MIDI Polyphonic Expression (MPE)</option>
              <option value="both">Both</option>
            </select>

            <div id="midi-device-selector" style="display:none">
              <label for="midiOutputSelect">MIDI Out</label>
              <select id="midiOutputSelect">
                <option>No devices found</option>
              </select>
              <div id="mpe-pressure-row" style="display:none">
                <label for="mpePressureSlider">MPE Pressure</label>
                <input type="range" id="mpePressureSlider" min="0" max="127" value="64" step="1">
              </div>
            </div>
          </fieldset>

          <!-- ---- moving between tetrads ----
               A tetrad is not a note but a place, and the move from one to
               the next is what the pointer is drawing. Slide leads the four
               voices there rather than re-striking them, so the progression
               is heard as motion; the pivot says which voice is held fixed
               while it happens. -->
          <fieldset>
            <legend>Voice Leading</legend>
            <label class="vis">
              <input type="checkbox" id="enableSlide" checked>Portamento</label>
            <div id="slide-duration-row">
              <div class="pressrow">
                <label for="slideDuration">Time</label>
                <span class="pressval" id="slide-v">0.25 s</span>
              </div>
              <input type="range" id="slideDuration" value="0.25" min="0" max="5" step="0.01"
                title="How long the four voices take to reach the next tetrad. At 0 they arrive at once.">
            </div>

            <div class="tune-h">Pivot</div>
            <div class="seg" id="pivot-seg">
              <button class="pivot-button" data-pivot-index="3" title="Soprano held">S</button>
              <button class="pivot-button" data-pivot-index="2" title="Alto held">A</button>
              <button class="pivot-button" data-pivot-index="1" title="Tenor held">T</button>
              <button class="pivot-button on" data-pivot-index="0" title="Bass held">B</button>
            </div>
          </fieldset>

          <!-- Xenachord's Play drawer, on the same terms: the family list and
               the slider's range are written in by createTimbrePicker rather
               than spelled out here, so the two apps cannot come to offer
               different shapes. -->
          <fieldset>
            <legend>Synth</legend>
            <label class="tune-h" for="s-family">Timbre</label>
            <select id="s-family"
              title="Wavetable: fixed waveform, volume-independent. Filtered wavetable: sine phase-modulated by its own low-passed output, so quiet notes stay near-sine and loud ones buzz."></select>
            <canvas id="s-wave" class="scope" style="margin-top:9px"></canvas>
            <div class="pressrow" style="margin-top:7px">
              <label for="s-timbre" id="s-label" style="margin:0;font-weight:600;
                color:var(--text);font-size:11.5px">Filtered saw</label>
            </div>
            <input id="s-timbre" type="range" min="1000" max="1300" step="1" value="1200">
            <div class="wave-ticks" id="s-ticks"></div>

            <div class="tune-h" style="margin-top:12px">Envelope</div>
            <canvas id="s-adsr" class="scope"
              title="Drag the corners: the first is the attack, the second the decay and the level it falls to, the last the release."></canvas>
            <div class="wave-ticks" id="s-adsr-ticks">
              <span id="s-a">A</span><span id="s-d">D</span>
              <span id="s-s">S</span><span id="s-r">R</span>
            </div>
          </fieldset>
        </div>
        <!-- ============ EXPORT ============
             Everything that leaves the app, in the two forms it can leave in:
             as a picture of the set, and as the set itself. -->
        <div class="drawer hidden" data-drawer="export">
          <h1>Tetrads <small>· export</small></h1>

          <!-- The picture is the VIEW, not the whole tetrahedron: what is
               exported is what the camera is looking at, at the size the
               viewport currently is, with everything outside the frustum
               left out. Turn the shape to the angle you want first. -->
          <fieldset>
            <legend>Picture</legend>
            <div class="btns">
              <button class="primary wide" id="dl-svg"
                title="The view as vectors — every point a circle and every label real text, so it can be edited and scaled without loss. (⇧⌘E)">⬇︎ Save View (.svg)</button>
              <button class="wide" id="dl-png"
                title="The same view rasterised from that SVG at up to 4x, for where a vector file is awkward.">⬇︎ Save View (.png)</button>
            </div>
          </fieldset>

          <fieldset>
            <legend>Data</legend>
            <div class="btns">
              <button class="wide" id="dl-csv"
                title="Every tetrad in the set: the enumerated chord, its notes as ratios, its cents, and its complexity under the chosen measure — sorted simplest first. (⇧⌘S)">⬇︎ Save Chords (.csv)</button>
            </div>
          </fieldset>
        </div>
      </div>

      <!-- ---- the two presses, under every drawer ----
           Update belongs to Complexity and Display and Play alike — every one
           of them can change what the next press generates — so it is not put
           inside any of them. Play is beside it because the two are the pair
           you alternate between once the panel is set. -->
      <div class="panel-foot">
        <button id="playButton" title="Sound the tetrad under the pointer (hold ⇧)">Play (<span class="symbol">⇧</span>)</button>
        <button id="updateButton" class="primary" title="Regenerate the set (↵)">Update (<span class="symbol">↵</span>)</button>
      </div>
    </div>
  </aside>

  <div id="main">
    <div id="container"></div>
    <div id="notation-display"></div>
  </div>
</div>

<div id="loading-overlay">loading...</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
